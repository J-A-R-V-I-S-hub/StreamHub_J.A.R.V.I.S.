name: Deploy to Oracle Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 158.180.235.83
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/StreamHub_J.A.R.V.I.S.
            if [ ! -f .env ]; then
              echo "❌ Manca il file .env sul server: crealo a mano (vedi .env.example)."
              exit 1
            fi
            git pull origin main
            docker compose up --build -d
            # Nginx Proxy Manager deve poter raggiungere il container per nome
            docker network connect streamhub_jarvis_default npm-app-1 2>/dev/null || true
            echo "✅ Deploy completato"
