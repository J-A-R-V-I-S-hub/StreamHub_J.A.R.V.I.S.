name: Deploy to Oracle Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 158.180.235.83
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/StreamHub_J.A.R.V.I.S.
            if [ ! -f .env ]; then
              echo "❌ Manca il file .env sul server: crealo a mano (vedi .env.example)."
              exit 1
            fi
            git pull origin main
            docker compose --profile panel up --build -d
            # Il container e' gia' sulla rete di Nginx Proxy Manager
            # (npm_default, dichiarata nel compose): non serve collegarlo
            # a mano e il collegamento non si perde se NPM viene ricreato.
            docker ps --filter name=streamhub --filter name=jarvis_panel \
              --format '{{.Names}}  {{.Status}}'
            echo "✅ Deploy completato"
