# nginx per il pannello Flutter Web.
#
# - SPA: ogni percorso sconosciuto torna a index.html (navigazione Flutter)
# - i file con hash nel nome (main.dart.js, assets/) sono immutabili:
#   cache lunga, cosi' il browser non li riscarica a ogni deploy

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # index.html non si cache mai: e' lui che punta ai file con hash
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # i file generati da Flutter hanno l'hash nel nome
    location ~* ^/assets/.+\.(js|css|wasm|json|svg|png|jpg|jpeg|gif|webp|ttf|otf|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # il service worker non deve bloccare i deploy
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
