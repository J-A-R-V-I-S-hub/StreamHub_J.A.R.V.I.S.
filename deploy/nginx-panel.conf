# Pannello + API su un solo dominio.
#
# Nginx Proxy Manager deve puntare SOLO a questo container (jarvis_panel:80):
# tutto il resto del routing vive qui dentro. Un upstream da configurare, non dieci.
#
# Risoluzione DNS a runtime (127.0.0.11 = DNS interno di Docker): così se
# streamhub_api viene ricreato e cambia IP, nginx lo ritrova senza restart.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # variabile: nginx risolve il nome a ogni richiesta, non una volta sola
    set $api http://streamhub_api:8080;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # ── API Xtream (la TV) ───────────────────────────────────────────
    location = /player_api.php { proxy_pass $api$request_uri; include /etc/nginx/api-proxy.conf; }
    location = /get.php        { proxy_pass $api$request_uri; include /etc/nginx/api-proxy.conf; }
    location = /xmltv.php      { proxy_pass $api$request_uri; include /etc/nginx/api-proxy.conf; }
    location = /logo.svg       { proxy_pass $api$request_uri; include /etc/nginx/api-proxy.conf; }
    location = /health         { proxy_pass $api$request_uri; include /etc/nginx/api-proxy.conf; }

    # Path classici: /movie/user/pass/id.mp4, /live/..., /series/...
    # Niente buffering: sono flussi, devono passare subito.
    location /movie/  { proxy_pass $api$request_uri; include /etc/nginx/api-proxy.conf; proxy_buffering off; }
    location /live/   { proxy_pass $api$request_uri; include /etc/nginx/api-proxy.conf; proxy_buffering off; }
    location /series/ { proxy_pass $api$request_uri; include /etc/nginx/api-proxy.conf; proxy_buffering off; }

    # ── API di gestione (il pannello) ────────────────────────────────
    location /api/ { proxy_pass $api$request_uri; include /etc/nginx/api-proxy.conf; }

    # ── Pannello statico ─────────────────────────────────────────────
    location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
    location ~* ^/assets/.+\.(js|css|wasm|json|svg|png|jpg|jpeg|gif|webp|ttf|otf|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / { try_files $uri $uri/ /index.html; }
}
